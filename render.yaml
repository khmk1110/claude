# Render の Blueprint（設定はダッシュボードで確認・変更できます）
# 秘密の値（会社情報・パスワード）はここに書かず、ダッシュボードの Environment で設定する。
databases:
  - name: kanri-db
    region: singapore
    plan: basic-256mb        # 有料プランは毎日自動バックアップ。作成時に最新のプラン名を確認してください
    postgresMajorVersion: "16"

services:
  - type: web
    name: kanri
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kanri-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false          # 例: kanri.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false          # 例: https://kanri.onrender.com
      - key: COMPANY_NAME
        sync: false
      - key: ISSUER_REPRESENTATIVE
        sync: false
      - key: ISSUER_ADDRESS
        sync: false
      - key: ISSUER_TEL
        sync: false
