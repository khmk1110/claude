# Render の Blueprint（無料プラン構成）
# - Web サービス: Render の無料プラン（しばらく使わないと停止し、次のアクセスで1分ほどかけて起動）
# - データベース: Neon の無料プラン（Render の無料DBは30日で期限切れのため使わない）
# 秘密の値はここに書かず、ダッシュボードの Environment で設定する（sync: false の項目）。
services:
  - type: web
    name: kanri
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # Neon の接続文字列（postgresql://...?sslmode=require）
      # 公開アドレス（xxx.onrender.com）は Render が自動で渡すため設定不要。独自ドメインを使うときだけ
      # ALLOWED_HOSTS と CSRF_TRUSTED_ORIGINS を追加する。
      - key: COMPANY_NAME
        sync: false
      - key: ISSUER_REPRESENTATIVE
        sync: false
      - key: ISSUER_ADDRESS
        sync: false
      - key: ISSUER_TEL
        sync: false
      # 初回起動時だけ使う（設定後は削除してよい。設定済みの値は上書きされない）
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_PAYROLL_PASSWORD
        sync: false
      - key: INITIAL_EXPENSES_PASSWORD
        sync: false
