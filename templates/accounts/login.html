{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block anon_content %}
<div class="card">
  <p class="eyebrow">{{ COMPANY_NAME }}</p>
  <h1 style="margin-bottom:16px">ログイン</h1>
  {% if form.errors %}<div class="msg msg-error">ユーザー名またはパスワードが正しくありません。</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="field"><label for="id_username">ユーザー名</label><input id="id_username" name="username" autocomplete="username" autocapitalize="none" required autofocus></div>
    <div class="field"><label for="id_password">パスワード</label><input id="id_password" type="password" name="password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit" style="width:100%">ログイン</button>
  </form>
</div>
{% endblock %}
