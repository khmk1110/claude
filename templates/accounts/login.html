{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>ログイン</h1>
  {% if form.errors %}<p class="error">ユーザー名またはパスワードが正しくありません。</p>{% endif %}
  <form method="post">{% csrf_token %}
    <p><label>ユーザー名<br>{{ form.username }}</label></p>
    <p><label>パスワード<br>{{ form.password }}</label></p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">ログイン</button>
  </form>
</div>
{% endblock %}
