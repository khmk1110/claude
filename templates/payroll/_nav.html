{% with p=request.path %}
<nav class="tabs">
  <a href="{% url 'payroll:index' %}{% if month_param %}?month={{ month_param }}{% endif %}" class="{% if p == '/payroll/' %}active{% endif %}">給与</a>
  <a href="{% url 'payroll:staff' %}{% if month_param %}?month={{ month_param }}{% endif %}" class="{% if p == '/payroll/staff/' %}active{% endif %}">正社員</a>
  <a href="{% url 'payroll:transfers' %}{% if month_param %}?month={{ month_param }}{% endif %}" class="{% if p == '/payroll/transfers/' %}active{% endif %}">振込</a>
  <a href="{% url 'payroll:list' %}{% if month_param %}?month={{ month_param }}{% endif %}" class="{% if p == '/payroll/list/' %}active{% endif %}">過去</a>
  <a href="{% url 'payroll:settings' %}" class="{% if p == '/payroll/settings/' or p == '/payroll/teams/' or p == '/payroll/employees/' %}active{% endif %}">設定</a>
</nav>
{% endwith %}
