<div class="lockbar {% if lock %}locked{% endif %}">
  {% if lock %}
    <span>✅ <b>{{ month|date:"n月" }}の勤怠は確定済み</b>（{{ lock.locked_at|date:"n/j H:i" }}）。直す時は「確定をやり直す」。</span>
    <form method="post" action="{% url 'attendance:lock' %}" class="inline">{% csrf_token %}
      <input type="hidden" name="month" value="{{ month_param }}"><input type="hidden" name="action" value="unlock"><input type="hidden" name="reason" value="確定をやり直す">
      <input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="btn btn-sm" type="submit">確定をやり直す</button></form>
  {% else %}
    <span class="small hint-pc">シフト表がそのまま勤怠になります（半日・有給などもここで変更）。月が終わったら確定してください。確定した月の「出勤日数」が翌月の給与の単価判定に使われます。</span>
    <span class="small hint-sp">月が終わったら勤怠を確定します</span>
    <form method="post" action="{% url 'attendance:lock' %}" class="inline" onsubmit="return confirm('{{ month|date:"n月" }}の勤怠を確定します。あとから「確定をやり直す」で直せます。よろしいですか？')">{% csrf_token %}
      <input type="hidden" name="month" value="{{ month_param }}"><input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button class="btn btn-ok btn-sm" type="submit">この月の勤怠を確定</button></form>
  {% endif %}
</div>
