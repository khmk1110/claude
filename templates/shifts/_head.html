<div class="page-head shift-head">
  <div><p class="eyebrow">シフト・勤怠</p><h1>{{ month|date:"Y年n月" }}のシフト</h1></div>
  <div class="page-actions">
    {% include "includes/monthnav.html" with extra_query=view_query %}
    <a class="btn" href="{% url 'shifts:share' %}?month={{ month_param }}">📷 <span class="hide-sp">LINE用の</span>画像</a>
  </div>
</div>
<nav class="tabs">
  <a class="{% if view == 'table' or view == 'numbers' %}active{% endif %}" href="{% url 'shifts:grid' %}?month={{ month_param }}">シフト表</a>
  <a class="{% if view == 'day' %}active{% endif %}" href="{% url 'shifts:grid' %}?month={{ month_param }}&view=day">日付別</a>
  <a class="{% if view == 'person' %}active{% endif %}" href="{% url 'shifts:grid' %}?month={{ month_param }}&view=person">{% if can_edit %}カレンダーで直す{% else %}カレンダー{% endif %}</a>
</nav>
