<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}社内管理システム{% endblock %}</title>
  <style>
    :root { --bg:#ffffff; --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#1d4ed8; --danger:#b91c1c; --ok:#15803d; --soft:#f9fafb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; color:var(--fg); background:var(--bg); font-size:15px; }
    header { display:flex; align-items:center; gap:24px; padding:12px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header .brand { font-weight:700; }
    nav a { color:var(--fg); text-decoration:none; margin-right:16px; }
    nav a:hover { color:var(--accent); }
    nav .lock::after { content:" 🔒"; font-size:12px; }
    main { padding:24px; max-width:1200px; margin:0 auto; }
    .card { border:1px solid var(--line); border-radius:8px; padding:20px; background:var(--bg); }
    .muted { color:var(--muted); }
    .error { color:var(--danger); font-weight:600; }
    .msg-success { color:var(--ok); }
    button, .btn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 18px; font-size:15px; cursor:pointer; }
    input, select { padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:15px; width:100%; max-width:360px; }
    table { border-collapse:collapse; width:100%; }
    th, td { border-bottom:1px solid var(--line); padding:8px; text-align:left; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
    .right { margin-left:auto; }
    h1 { font-size:22px; margin:0 0 12px; } h2 { font-size:18px; margin:28px 0 10px; }
    a { color:var(--accent); }
    .pagehead { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    .toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 0; }
    .toolbar form.inline input { margin:0 4px; }
    .btn-light { background:#fff; color:var(--fg); border:1px solid #d1d5db; border-radius:6px; padding:8px 14px; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; }
    .btn { text-decoration:none; display:inline-block; }
    .monthnav { display:flex; gap:6px; align-items:center; }
    .small { font-size:13px; } .strong { font-weight:700; } .big { font-size:26px; font-weight:700; margin-top:4px; }
    .num { text-align:right; white-space:nowrap; }
    .warn { color:var(--danger); font-weight:700; } .attn { color:#b45309; font-weight:700; }
    .rowattn { background:#fffbeb; } .attnbox { border-color:#f59e0b; background:#fffbeb; margin-bottom:16px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#f3f4f6; color:#374151; }
    .badge.ok, .badge.confirmed { background:#dcfce7; color:#166534; } .badge.modified { background:#fef3c7; color:#92400e; }
    .tag { font-size:11px; background:#eef2ff; color:#3730a3; padding:1px 6px; border-radius:4px; }
    .table-scroll { overflow-x:auto; }
    table.list th { background:var(--soft); font-weight:600; font-size:13px; }
    td.sat { color:#1d4ed8; } td.sun { color:#b91c1c; }
    table.shift { border-collapse:collapse; user-select:none; font-size:13px; }
    table.shift th, table.shift td { border:1px solid var(--line); padding:0; text-align:center; }
    table.shift th.name { text-align:left; padding:4px 8px; min-width:120px; position:sticky; left:0; background:#fff; z-index:1; cursor:pointer; white-space:nowrap; }
    table.shift thead th { background:var(--soft); padding:4px 0; }
    table.shift th.day { width:34px; cursor:pointer; } table.shift th.sat { color:#1d4ed8; } table.shift th.sun { color:#b91c1c; }
    table.shift td.cell { width:34px; height:36px; cursor:pointer; font-weight:700; }
    table.shift td.cell.sel { outline:3px solid #2563eb; outline-offset:-3px; }
    table.shift td.num { padding:0 8px; }
    .palette { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--soft); position:sticky; top:0; z-index:2; }
    .palette .wt { border:0; border-radius:6px; padding:8px 12px; font-weight:700; cursor:pointer; font-size:14px; }
    .orderlist { list-style:none; padding:0; max-width:520px; } .orderlist li { display:flex; gap:8px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; }
    .badge.st-not_calculated { background:#f3f4f6; } .badge.st-in_progress { background:#fef3c7; color:#92400e; }
    .badge.st-calculated { background:#dbeafe; color:#1e40af; } .badge.st-review { background:#ede9fe; color:#5b21b6; }
    .badge.st-confirmed { background:#dcfce7; color:#166534; }
    .msg-info { color:#1e40af; } .msg-warning { color:#b45309; font-weight:700; }
    textarea { padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; font-family:inherit; }
    .msg-error { color:var(--danger); font-weight:700; }
    @media (max-width: 640px) { header, main { padding:12px 16px; } }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <header>
    <span class="brand">{{ COMPANY_NAME }} 社内管理</span>
    <nav>
      <a href="{% url 'dashboard' %}">ダッシュボード</a>
      <a href="{% url 'shifts:grid' %}">シフト</a>
      <a href="{% url 'attendance:month' %}">勤怠・有給</a>
      <a href="{% url 'members:list' %}">メンバー</a>
      <a class="lock" href="{% url 'payroll:index' %}">給与・報酬</a>
      <a class="lock" href="{% url 'expenses:index' %}">資料・経費</a>
    </nav>
    <form class="right" method="post" action="{% url 'logout' %}">{% csrf_token %}
      <span class="muted">{{ user }}</span> <button type="submit">ログアウト</button>
    </form>
  </header>
  {% endif %}
  <main>
    {% for message in messages %}<p class="msg-{{ message.tags }}">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
