<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク編集</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
  <h1>タスク編集</h1>
  <form method="post" action="{{ url_for('update_task', task_id=task.id) }}" class="task-form">
    <input type="text" name="title" value="{{ task.title }}" required>
    <textarea name="description" rows="3">{{ task.description }}</textarea>
    <div class="form-row">
      <input type="text" name="category" value="{{ task.category }}" placeholder="カテゴリ">
      <select name="priority">
        {% for p in PRIORITIES %}
        <option value="{{ p }}" {% if p == task.priority %}selected{% endif %}>優先度: {{ PRIORITY_LABELS[p] }}</option>
        {% endfor %}
      </select>
      <select name="status">
        {% for s in STATUSES %}
        <option value="{{ s }}" {% if s == task.status %}selected{% endif %}>{{ STATUS_LABELS[s] }}</option>
        {% endfor %}
      </select>
      <input type="date" name="due_date" value="{{ task.due_date or '' }}">
    </div>
    <div class="form-row">
      <button type="submit">保存</button>
      <a href="{{ url_for('index') }}" class="link-btn">キャンセル</a>
    </div>
  </form>
</div>
</body>
</html>
